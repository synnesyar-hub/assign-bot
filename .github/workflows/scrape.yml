# .github/workflows/scrape.yml

name: Scrape Database & Database2

on:
  schedule:
    - cron: "*/5 * * * *"   # tiap 5 menit (waktu UTC, tidak dijamin presisi oleh GitHub)
  workflow_dispatch: {}     # biar bisa trigger manual dari tab Actions kalau perlu

concurrency:
  group: scrape-gha
  cancel-in-progress: true  # kalau run baru mulai sementara run lama masih jalan, run lama dibatalkan

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 8   # jaga-jaga -- kalau macet, jangan sampai gantung lama & numpuk antrian

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Install & connect Cloudflare WARP
        run: |
          curl -fsSL https://pkg.cloudflareclient.com/pubkey.gpg | sudo gpg --yes --dearmor --output /usr/share/keyrings/cloudflare-warp-archive-keyring.gpg
          echo "deb [signed-by=/usr/share/keyrings/cloudflare-warp-archive-keyring.gpg] https://pkg.cloudflareclient.com/ $(lsb_release -cs) main" | sudo tee /etc/apt/sources.list.d/cloudflare-client.list
          sudo apt-get update && sudo apt-get install -y cloudflare-warp

          sudo warp-cli --accept-tos registration new
          sudo warp-cli --accept-tos mode warp
          sudo warp-cli --accept-tos connect

          # tunggu sampai status Connected (max ~30 detik)
          for i in $(seq 1 15); do
            STATUS=$(warp-cli --accept-tos status | head -n1)
            echo "warp status: $STATUS"
            if echo "$STATUS" | grep -q "Connected"; then
              break
            fi
            sleep 2
          done

      - name: Verify egress IP location
        run: curl -s https://ipinfo.io | tee ipinfo.json

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install Python dependencies
        run: pip install -r requirements.txt

      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-chromium-${{ runner.os }}

      - name: Install Playwright Chromium
        run: |
          playwright install --with-deps chromium

      - name: Test connectivity to target site
        run: |
          curl -v --max-time 15 -o response.html -w "\nHTTP_STATUS: %{http_code}\n" https://oss-incident.telkom.co.id || true
          echo "--- Body response (500 karakter pertama) ---"
          head -c 500 response.html

      - name: Run scrape (Database & Database2 only)
        env:
          INS_USERNAME: ${{ secrets.INS_USERNAME }}
          INS_PASSWORD: ${{ secrets.INS_PASSWORD }}
          INS_OTP_SECRET: ${{ secrets.INS_OTP_SECRET }}
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: python run_scrape_gha.py